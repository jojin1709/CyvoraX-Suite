name: Windows EXE Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows EXE installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read Maven versions
        id: versions
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -LiteralPath "pom.xml"
          $projectVersion = $pom.project.version
          $javafxVersion = $pom.project.properties.'javafx.version'
          "project=$projectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "javafx=$javafxVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Project version: $projectVersion"
          "JavaFX version: $javafxVersion"

      - name: Download JavaFX jmods
        shell: pwsh
        run: |
          $javafxVersion = "${{ steps.versions.outputs.javafx }}"
          $downloadDir = Join-Path $env:GITHUB_WORKSPACE "tools"
          $zipPath = Join-Path $downloadDir "openjfx-${javafxVersion}_windows-x64_bin-jmods.zip"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $url = "https://download2.gluonhq.com/openjfx/${javafxVersion}/openjfx-${javafxVersion}_windows-x64_bin-jmods.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Expand-Archive -LiteralPath $zipPath -DestinationPath $downloadDir -Force
          $jmods = Get-ChildItem -Path $downloadDir -Recurse -Filter "javafx.controls.jmod" |
            Select-Object -First 1 |
            ForEach-Object { $_.Directory.FullName }
          if (-not $jmods) {
            throw "JavaFX jmods were not found after extraction."
          }
          "JAVAFX_JMODS=$jmods" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JavaFX jmods: $jmods"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path -LiteralPath $nsisPath) {
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          & (Join-Path $nsisPath "makensis.exe") /VERSION

      - name: Build CyvoraX Windows installer
        shell: pwsh
        run: |
          .\package-windows.ps1 -Installer -JavaFxJmods "$env:JAVAFX_JMODS"

      - name: Verify installer artifact
        id: artifact
        shell: pwsh
        run: |
          $version = "${{ steps.versions.outputs.project }}"
          $installer = Join-Path $env:GITHUB_WORKSPACE "target\CyvoraX-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $file = Get-Item -LiteralPath $installer
          if ($file.Length -lt 50MB) {
            throw "Installer is unexpectedly small and may not contain the bundled runtime: $($file.Length) bytes"
          }
          "path=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($file.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$($file.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Installer: $($file.FullName)"
          "Size: $($file.Length) bytes"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = "${{ steps.versions.outputs.project }}"
          $installer = "${{ steps.artifact.outputs.path }}"
          $installerName = "${{ steps.artifact.outputs.name }}"
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "release-notes.md"
          @"
          # CyvoraX Suite $tag

          Windows EXE installer release.

          ## Asset
          - $installerName

          ## Packaging
          - Bundles a trimmed Java runtime built with jlink.
          - Users do not need to install Java manually.
          - Installs CyvoraX Suite with Start Menu shortcut support.
          - Includes optional Desktop shortcut support.
          - Registers a Windows uninstall entry.
          - Preserves `%USERPROFILE%\.cyvorax-suite` data during upgrades.

          ## Validation
          - Maven package completed.
          - jpackage app image completed.
          - NSIS installer completed.
          - Installer size: ${{ steps.artifact.outputs.size }} bytes.
          "@ | Set-Content -LiteralPath $notesPath -Encoding UTF8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view $tag --json assets --jq ".assets[].name"
            foreach ($asset in $assets) {
              if ($asset -like "*.jar" -or $asset -like "CyvoraX-Setup-*.exe") {
                gh release delete-asset $tag $asset -y
              }
            }
            gh release edit $tag --title "CyvoraX Suite $tag" --notes-file $notesPath
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "CyvoraX Suite $tag" --notes-file $notesPath
          }
